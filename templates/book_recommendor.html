<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommender</title>
     <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}

<div class="container mt-5">

    <div class="text-center mb-4">
        <h2>📚 Book Recommender</h2>
        <p class="text-muted">
            Enter any book you like — we'll recommend similar ones.
        </p>
    </div>

    <!-- Input Form -->
    <form action='/book_recommendations' method="POST">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <input 
                    id="user_input"
                    type="text" 
                    name="user_input" 
                    class="form-control form-control-lg" 
                    placeholder="Enter a book name you like..."
                    required
                >
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-dark btn-lg w-100">
                    Recommend
                </button>
            </div>
        </div>
    </form>
{% if error %}
<div class="alert alert-danger mt-4 text-center">
    {{ error }}
</div>
{% endif %}

{% if data %}

<div class="container mt-5">
    <h4 class="text-center mb-4">✨ Recommended Books</h4>

    <div class="row">
        {% for i in data %}
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm h-100">

                <img src="{{ i[2] }}"
                     class="card-img-top"
                     style="height:220px; object-fit:contain; background:#f8f9fa;">

                <div class="card-body">
                    <h6 class="card-title text-truncate">
                        {{ i[0] }}
                    </h6>

                    <p class="card-text text-muted">
                        {{ i[1] }}
                    </p>
                </div>

            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endif %}



</div>


</body>
</html>
